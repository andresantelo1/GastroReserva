spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gastroreserva}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
      issuer: gastroreserva-api
  bootstrap:
    admin:
      nombre: ${ADMIN_NAME:Administrador}
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
